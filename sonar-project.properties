# =====================================================================
# SonarQube Configuration for RapidERP (Angular Application)
# =====================================================================

# Project Identification
sonar.projectKey=rapiderp
sonar.projectName=RapidERP
sonar.projectVersion=1.0.0

# Local SonarQube Server Connection
sonar.host.url=http://localhost:9000
sonar.token=squ_52b6ccda1dc5f23f8d9374e9ca7454edca9513a9

# Source & Test Directories
sonar.sources=src/app
sonar.exclusions=**/node_modules/**,**/dist/**,public/**,**/*.spec.ts,src/app/components/item/item.mock.ts,**/assets/**
sonar.cpd.exclusions=src/app/components/lookup-template/**,src/app/components/city/**,src/app/components/state/**,src/app/components/item/item.mock.ts,**/*.spec.ts,public/**

# Language & Compiler Configurations
sonar.typescript.tsconfigPath=tsconfig.app.json
sonar.sourceEncoding=UTF-8

# Code Coverage (LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
