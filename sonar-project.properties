# =====================================================================
# SonarQube Configuration for RapidERP (Angular Application)
# =====================================================================

# Project Identification
sonar.projectKey=rapiderp
sonar.projectName=RapidERP
sonar.projectVersion=1.0.0

# Source & Test Directories
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,public/**

# Language & Compiler Configurations
sonar.typescript.tsconfigPath=tsconfig.app.json
sonar.sourceEncoding=UTF-8

# Code Coverage (LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Duplication Exclusions (where template duplication is structural)
sonar.cpd.exclusions=**/*.spec.ts,src/app/components/item/item.mock.ts
