<div
  class="floating-input-wrapper relative w-full"
  [class.focused]="isFocused()"
  [class.floating]="isFloating"
  [class.has-left-icon]="icon() !== 'none'"
  [class.has-right-icon]="type() === 'password'"
>
  <!-- Main Rounded Pill Container -->
  <div
    class="input-container relative flex items-center w-full h-[50px] px-4 rounded-full border transition-all duration-200 bg-white"
    [class.border-[#06a9ea]]="isFocused()"
    [class.ring-2]="isFocused()"
    [class.ring-[#06a9ea]/15]="isFocused()"
    [class.border-slate-300]="!isFocused() && !val()"
    [class.border-slate-400]="!isFocused() && val()"
    [class.opacity-60]="disabled()"
  >
    <!-- Left Icon -->
    @if (icon() === 'mail') {
      <div class="left-icon flex items-center justify-center text-slate-400 transition-colors mr-2.5 shrink-0"
           [class.text-[#06a9ea]]="isFocused()">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
      </div>
    } @else if (icon() === 'lock') {
      <div class="left-icon flex items-center justify-center text-slate-400 transition-colors mr-2.5 shrink-0"
           [class.text-[#06a9ea]]="isFocused()">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
    } @else if (icon() === 'user') {
      <div class="left-icon flex items-center justify-center text-slate-400 transition-colors mr-2.5 shrink-0"
           [class.text-[#06a9ea]]="isFocused()">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      </div>
    }

    <!-- Actual Input Element -->
    <input
      [id]="id()"
      [name]="name()"
      [type]="currentType"
      [value]="val()"
      [disabled]="disabled()"
      [required]="required()"
      [autocomplete]="autocomplete()"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      class="w-full h-full bg-transparent text-slate-800 text-sm font-medium focus:outline-none placeholder-transparent select-text caret-[#06a9ea]"
    />

    <!-- Right Icon / Password Visibility Toggle -->
    @if (type() === 'password') {
      <button
        type="button"
        (click)="togglePasswordVisibility()"
        tabindex="-1"
        aria-label="Toggle password visibility"
        class="right-icon flex items-center justify-center text-slate-400 hover:text-slate-600 focus:outline-none transition-colors ml-2 shrink-0 p-1 rounded-full"
      >
        @if (showPassword()) {
          <!-- Eye Off Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-[#06a9ea]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
          </svg>
        } @else {
          <!-- Eye Icon (from Image 1) -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
        }
      </button>
    }
  </div>

  <!-- Floating Label with Notch Effect -->
  <label
    [for]="id()"
    class="floating-label absolute pointer-events-none transition-all duration-200 select-none font-sans"
    [class.floating-top]="isFloating"
    [class.resting]="!isFloating"
  >
    {{ label() }}
  </label>
</div>
