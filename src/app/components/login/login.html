<div class="login-page-bg min-h-screen w-full flex items-center justify-center p-3 sm:p-5 lg:p-8 select-none">
  <!-- Centered Replica Login Card (Increased width for spacious layout) -->
  <div
    class="login-card w-full max-w-[1140px] xl:max-w-[1160px] bg-white rounded-[28px] sm:rounded-[32px] shadow-2xl shadow-blue-950/30 overflow-hidden flex flex-col md:flex-row items-stretch border border-white/25 transition-all duration-300">

    <!-- Left Column: Directly uses the user-provided high-res artwork (Exact replica, 100% visible & razor sharp) -->
    <div
      class="left-panel w-full md:w-[56%] lg:w-[56%] relative overflow-hidden bg-[#0266d6] flex items-center justify-center p-0 group/banner select-none shrink-0 min-h-[300px] sm:min-h-[380px] md:min-h-[560px]">
      <img
        src="assets/images/login-left-banner.png"
        alt="Rapid ERP - Complete Business Management Accounting & ERP Software"
        class="w-full h-full object-cover object-center select-none pointer-events-none transition-transform duration-700 ease-out group-hover/banner:scale-[1.01]"
        draggable="false"
      />
      <!-- Subtle modern glass shimmer / light sweep effect on hover -->
      <div class="banner-shimmer absolute inset-0 pointer-events-none opacity-0 group-hover/banner:opacity-100 transition-opacity duration-700"></div>
    </div>

    <!-- Right Column: Login Form (Spacious padding and comfortable layout) -->
    <div class="right-panel w-full md:w-[44%] lg:w-[44%] bg-white p-7 sm:p-9 lg:p-12 flex flex-col justify-between grow">
      <div>

        <!-- Top Center Client Company Logo (Exact match from reference) -->
        <div class="flex flex-col items-center justify-center mb-5">
          <div class="relative flex items-center justify-center dynamic-logo-container">
            <div class="w-18 h-18 sm:w-20 sm:h-20 rounded-full flex items-center justify-center transition-transform duration-300 hover:scale-105">
              <img
                src="assets/images/client-logo-extracted.png"
                alt="ABC Trading LLC Emblem"
                class="w-full h-full object-contain rounded-full shadow-lg shadow-sky-400/25"
                draggable="false"
              />
            </div>
          </div>

          <!-- Company Typography -->
          <h3 class="text-sm sm:text-base font-extrabold tracking-wide text-slate-800 mt-2.5 text-center">
            ABC TRADING LLC
          </h3>

          <!-- Client Partner Portal Pill -->
          <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#e0f2fe] text-[#0284c7] text-[10px] font-bold tracking-wider uppercase mt-1 shadow-2xs">
            <span class="w-1.5 h-1.5 rounded-full bg-[#00a6f4] animate-pulse"></span>
            CLIENT PARTNER PORTAL
          </div>
        </div>

        <!-- Section Title (Exact match to reference) -->
        <div class="mb-4 pt-1">
          <h4 class="text-sm font-bold text-slate-800 tracking-tight">Sign in to your account</h4>
          <p class="text-[11px] text-slate-400 mt-0.5">Enter your verified credentials to access ERP modules</p>
        </div>

        <!-- Error Message Alert Box -->
        @if (errorMsg()) {
          <div class="mb-3.5 p-2.5 px-3.5 rounded-2xl bg-red-50 border border-red-200/90 text-red-600 text-xs font-semibold flex items-center gap-2 animate-in fade-in zoom-in-95 duration-150 shadow-xs">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <span class="flex-1 text-left leading-snug">{{ errorMsg() }}</span>
          </div>
        }

        <!-- Form Elements (Exact Match: Pill-shaped Inputs) -->
        <form (ngSubmit)="onLogin()" class="space-y-4">
          <!-- Username Input with Mail Icon in Rounded Pill -->
          <div class="relative group">
            <span class="absolute left-4.5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[#00a6f4] transition-colors pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </span>
            <input
              id="login-username"
              type="text"
              [ngModel]="username()"
              (ngModelChange)="username.set($event)"
              name="username"
              placeholder="Username"
              autocomplete="username"
              required
              class="pill-input w-full h-11.5 sm:h-12 rounded-full border border-slate-200 bg-white pl-12 pr-5 text-xs sm:text-sm font-medium text-slate-700 placeholder:text-slate-400 focus:outline-none transition-all shadow-2xs"
            />
          </div>

          <!-- Password Input with Lock Icon & Eye Toggle in Rounded Pill -->
          <div class="relative group">
            <span class="absolute left-4.5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[#00a6f4] transition-colors pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" />
                <path d="M8 11V7a4 4 0 018 0v4" stroke="currentColor" stroke-linecap="round" />
              </svg>
            </span>
            <input
              id="login-password"
              [type]="showPassword() ? 'text' : 'password'"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              name="password"
              placeholder="Password"
              autocomplete="current-password"
              required
              class="pill-input w-full h-11.5 sm:h-12 rounded-full border border-slate-200 bg-white pl-12 pr-12 text-xs sm:text-sm font-medium text-slate-700 placeholder:text-slate-400 focus:outline-none transition-all shadow-2xs"
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              [title]="showPassword() ? 'Hide password' : 'Show password'"
              class="absolute right-4.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition cursor-pointer"
            >
              @if (!showPassword()) {
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                </svg>
              }
            </button>
          </div>

          <!-- Remember Me Checkbox & Forgot Password Link -->
          <div class="flex items-center justify-between text-xs pt-0.5">
            <label class="inline-flex items-center gap-2 cursor-pointer select-none text-slate-600">
              <input
                type="checkbox"
                [checked]="rememberMe()"
                (change)="toggleRememberMe()"
                class="w-4 h-4 rounded border-slate-300 text-[#00a6f4] focus:ring-[#00a6f4]/30 transition cursor-pointer"
              />
              <span class="font-normal text-slate-600 text-xs sm:text-[13px]">Remember Me</span>
            </label>

            <button
              type="button"
              (click)="forgotPassword()"
              class="text-[#dc2626] hover:text-[#b91c1c] font-medium text-xs sm:text-[13px] transition-colors cursor-pointer"
            >
              Forgot Password?
            </button>
          </div>

          <!-- Submit Button: Login → -->
          <div class="pt-2">
            <button
              type="submit"
              [disabled]="isLoading()"
              class="btn-login-pill w-full h-11.5 sm:h-12 rounded-full font-bold text-white flex items-center justify-center gap-2 text-xs sm:text-sm cursor-pointer disabled:opacity-75 disabled:cursor-not-allowed group"
            >
              @if (isLoading()) {
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Logging in...</span>
              } @else {
                <span class="tracking-wide">Login</span>
                <span class="group-hover:translate-x-1 transition-transform font-bold">&rarr;</span>
              }
            </button>
          </div>
        </form>
      </div>

      <!-- Copyright Footer (Exact match to reference) -->
      <div class="mt-6 text-center">
        <p class="text-xs text-slate-400 select-none">
          &copy; 2026 InfyCRM
        </p>
      </div>
    </div>

  </div>
</div>
