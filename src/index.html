<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Rapid ERP - Accounting & Business Management Software</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description"
    content="All-in-one ERP software for accounting, inventory, POS, invoicing, payroll and more." />

  <!-- Progressive Web App (PWA) & Apple iOS Directives -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RapidERP" />
  <meta name="theme-color" content="#0284c7" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/assets/icons/icon-152x152.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/icon-192x192.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="/assets/icons/icon-152x152.png" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <script>
    // Capture early PWA install prompt before Angular initializes
    window.addEventListener('beforeinstallprompt', function(e) {
      window.__pwa_deferredPrompt = e;
    });
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body
  class="font-['Inter',sans-serif] antialiased text-slate-800 bg-[#f8fafc] m-0 p-0 selection:bg-[#06a9ea] selection:text-white">

</body>

</html>
